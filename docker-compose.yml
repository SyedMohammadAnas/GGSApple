services:
  # iMac Lab (Homelab down): media plane only. Session/token APIs live in expert-web.
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - '7880:7880'
      - '7881:7881'
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '7900-7999:7900-7999/udp'
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command: --config /livekit.yaml
    restart: unless-stopped

  # Legacy Express API — opt-in only (profile: api). Prefer expert-web for sessions/tokens.
  api:
    profiles: ['api']
    build: ./backend
    ports:
      - '3000:3000'
    volumes:
      # Assets + experiment static page — do not mount all of ./backend (overwrites image dist/)
      - ./backend/assets:/app/assets
      - ./backend/public:/app/public
    env_file: .env
    depends_on:
      - livekit
    restart: unless-stopped
